[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adisweb-client"
version = "0.1.0"
description = "Python client for aDISWeb (a|S|tec/OCLC BIBLIOTHECAplus) OPAC systems — ported from opacapp/opacclient Adis.java"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["adisweb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration test against the real OPAC (requires ADISWEB_LIVE=1)",
]
